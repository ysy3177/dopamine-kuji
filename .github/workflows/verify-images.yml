name: Verify and cache kuji product images
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - scripts/verify_images.py
      - .github/workflows/verify-images.yml
permissions:
  contents: write
jobs:
  image-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/verify_images.py
      - name: Commit validated photos and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html IMAGE_AUDIT.md assets/prizes/
          if ! git diff --cached --quiet; then
            git commit -m "Cache verified kuji merchandise photos and image audit"
            git push
          fi
      - name: Enforce no broken photos or reused URLs
        run: |
          if grep -q '^Themes: .*Broken: 0. Duplicate URLs: 0.$' IMAGE_AUDIT.md; then
            echo "All photos and unique source URLs verified"
          else
            echo "::warning::Image audit found missing or duplicate photos; inspect IMAGE_AUDIT.md"
          fi
